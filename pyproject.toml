[project]
name = "airline-delays"
version = "1.1.0"
description = "Brazil's scheduled domestic flights 2000-2013 -- from ANAC's raw records to a published article's tables, its theory, and a flight-level delay predictor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [
  { name = "William Eduardo Bendinelli", email = "wbendinelli@gmail.com" },
]
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=17",
  "duckdb>=1.1",
  "numpy>=2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "linearmodels>=6",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "typer>=0.12",
  "pyreadstat>=1.2",
  "requests>=2.32",
  "tqdm>=4.66",
  "sympy>=1.13,<2",
  "matplotlib>=3.9,<4",
]

[project.urls]
Homepage = "https://github.com/wbendinelli/airline-delays"
Repository = "https://github.com/wbendinelli/airline-delays"
Issues = "https://github.com/wbendinelli/airline-delays/issues"

[project.scripts]
airline-delays = "airline_delays.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16",
  "pre-commit>=4",
  "frictionless[parquet]>=5.18",
  "jsonschema>=4.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "analysis: rebuilds the panel from the committed fact table and diffs it against data/analysis/ (ADR-0014) -- skips when those tables or data/derived/ are absent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airline_delays"]
