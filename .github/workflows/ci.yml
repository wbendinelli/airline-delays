# Five checks: lint (ruff), test (pytest against the committed fixture and the
# committed tables, no network), citation (CITATION.cff stays schema-valid),
# docs-paths (every backticked path and `just`/`airline-delays` command in the
# READMEs, docs/ and the data guides resolves to something real --
# scripts/check_docs_paths.py -- and the Markdown renders on GitHub: math
# delimiters, tables, fences -- scripts/check_markdown_math.py),
# metadata (datapackage.json, docs/dictionary.md,
# .zenodo.json and reports/summary.json are rebuilds of the registry and the
# tables, and the Data Package validates with frictionless).
#
# Third-party actions are pinned by commit SHA (tag kept as a comment), per
# SECURITY.md; Dependabot proposes the bumps.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Tests against the committed fixture and tables (no network, no data/raw)
        run: uv run pytest -q

  citation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dieghernan/cff-validator@d8f85828214016ce6976e740b6e0504c0fdc4dbb # v5

  docs-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Every path and command quoted in the READMEs and docs must exist
        run: uv run python scripts/check_docs_paths.py
      - name: Math delimiters, tables and fences render on GitHub
        run: uv run python scripts/check_markdown_math.py

  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: The generated metadata is a rebuild of the registry and the tables
        run: |
          uv run airline-delays dictionary --check
          uv run airline-delays datapackage --check
          uv run airline-delays zenodo-json --check
          uv run airline-delays summary --check
      - name: The Data Package validates (frictionless, first 5,000 rows of each resource; `just validate` runs them all)
        run: uv run frictionless validate datapackage.json --type package --limit-rows 5000
